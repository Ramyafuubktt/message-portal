
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Portal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">Message Portal</span>
    <a href="/admin" class="admin-link">Admin Panel</a>
  </nav>

  <header class="hero">
    <h1>Welcome to Message Portal</h1>
    <p>Enter your details and upload an image if needed.</p>
  </header>

  <section class="gallery">
    <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=500&q=75" alt="Office">
    <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=500&q=75" alt="Workspace">
    <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=500&q=75" alt="Team">
  </section>

  <main class="form-container">
    <h2>Submit Your Details</h2>

    <form id="messageForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>

      <label for="marks">Marks (out of 100)</label>
      <input type="number" id="marks" name="marks"
             min="0" max="100" step="1" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <label for="image">Upload Image (optional, max 5 MB)</label>
      <input type="file" id="image" name="image"
             accept="image/jpeg,image/png,image/webp,image/gif">

      <img id="preview" class="upload-preview"
           alt="Selected image preview" hidden>

      <button type="submit" id="submitBtn">Submit</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("messageForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      preview.hidden = true;
      preview.removeAttribute("src");

      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        status.textContent = "Image must be 5 MB or smaller.";
        imageInput.value = "";
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      status.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = new FormData(form);
      data.set("marks", String(Number(data.get("marks"))));

      submitBtn.disabled = true;
      status.textContent = "Submitting...";

      try {
        const response = await fetch("/api/messages", {
          method: "POST",
          body: data
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Submission failed.");
        }

        status.textContent = result.message;
        form.reset();
        preview.hidden = true;
        preview.removeAttribute("src");
      } catch (error) {
        status.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>

    });
  </script>

</body>
</html>
