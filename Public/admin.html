
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">Admin Dashboard</span>
    <a href="/" class="admin-link">User Form</a>
  </nav>

  <main class="admin-container">
    <h1>Submitted Messages</h1>
    <p>Messages submitted through the user form appear here.</p>
    <p id="status" role="status">Loading messages...</p>
    <div id="messages" class="message-grid"></div>
  </main>

  <script>
    const container = document.getElementById("messages");
    const status = document.getElementById("status");

    async function loadMessages() {
      try {
        const response = await fetch("/api/messages");

        if (!response.ok) {
          throw new Error("Could not load messages.");
        }

        const messages = await response.json();
        container.replaceChildren();

        if (messages.length === 0) {
          status.textContent = "No messages submitted yet.";
          return;
        }

        status.textContent = `Total submissions: ${messages.length}`;

        messages.forEach(item => {
          const card = document.createElement("article");
          card.className = "message-card";

          const title = document.createElement("h3");
          title.textContent = item.name;
          card.appendChild(title);

          const details = [
            ["Email", item.email],
            ["Phone", item.phone],
            ["Date", String(item.submitted_date).slice(0, 10)],
            ["Rating", `${item.rating} / 5`],
            ["Message", item.message]
          ];

          details.forEach(([label, value]) => {
            const p = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = label + ": ";
            p.appendChild(strong);
            p.appendChild(document.createTextNode(value ?? ""));
            card.appendChild(p);
          });

          container.appendChild(card);
        });
      } catch (error) {
        status.textContent = error.message;
      }
    }

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>

</body>
</html>


</body>
</html>
