
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Portal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">Message Portal</span>
    <a href="/admin" class="admin-link">Admin Panel</a>
  </nav>

  <header class="hero">
    <h1>Welcome to Message Portal</h1>
    <p>Share your feedback or send us a message.</p>
  </header>

  <section class="gallery">
    <img
      src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=600&q=80"
      alt="Modern office">
    <img
      src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=600&q=80"
      alt="Office workspace">
    <img
      src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=600&q=80"
      alt="Team working together">
  </section>

  <main class="form-container">
    <h2>Send a Message</h2>

    <form id="messageForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name"
             placeholder="Enter your name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email"
             placeholder="example@email.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone"
             placeholder="Enter your phone number" required>

      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
      
      <label for="marks">Marks (out of 100)</label>
      <input
        type="number"
        id="marks"
        name="marks"
        min="0"
        max="100"
        step="1"
        placeholder="Enter marks from 0 to 100"
        required
        >

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5"
                placeholder="Type your message here" required></textarea>

      <button type="submit" id="submitBtn">Submit Message</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("messageForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = Object.fromEntries(
        new FormData(form).entries()
      );

      data.rating = Number(data.rating);
      submitBtn.disabled = true;
      status.textContent = "Submitting...";

      try {
        const response = await fetch("/api/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Submission failed.");
        }

        status.textContent = result.message;
        form.reset();
      } catch (error) {
        status.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
