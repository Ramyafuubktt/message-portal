<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fb;
      padding: 20px;
      color: #222;
    }

    h2 {
      text-align: center;
    }

    #messages {
      max-width: 700px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 12px #0001;
      overflow-wrap: anywhere;
    }

    .card p {
      margin: 12px 0;
    }

    .user-image {
      display: block;
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 8px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 20px auto;
      background: #3157d5;
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h2>Admin Panel - User Details</h2>

  <a class="back" href="/">Back to User Page</a>

  <div id="messages">Loading messages...</div>

  <script>
    async function loadMessages() {
      const box = document.getElementById("messages");

      try {
        const response = await fetch("/api/messages");

        if (!response.ok) {
          throw new Error("Could not load messages");
        }

        const messages = await response.json();
        box.replaceChildren();

        if (!messages.length) {
          box.textContent = "No details submitted yet.";
          return;
        }

        messages.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = "User Submission";
          card.appendChild(title);

          ["name", "email", "phone", "date"].forEach(key => {
            const p = document.createElement("p");
            p.textContent =
              key.charAt(0).toUpperCase() +
              key.slice(1) + ": " +
              (item[key] ?? "Not provided");

            card.appendChild(p);
          });

          // Display uploaded image if the backend returns its URL
          if (item.imageUrl || item.image) {
            const label = document.createElement("p");
            label.textContent = "Uploaded Image:";
            card.appendChild(label);

            const img = document.createElement("img");
            img.className = "user-image";
            img.alt = "User uploaded image";
            img.src = item.imageUrl || item.image;

            img.onerror = () => {
              img.alt = "Image could not be loaded";
              img.removeAttribute("src");
            };

            card.appendChild(img);
          }

          // Display message if one is submitted
          if (item.message) {
            const p = document.createElement("p");
            p.textContent = "Message: " + item.message;
            card.appendChild(p);
          }

          // Never display submitted passwords in the Admin Panel.

          box.appendChild(card);
        });

      } catch (error) {
        box.textContent =
          "Could not load messages. Check your server and database.";
      }
    }

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>

</body>
</html>

</body>
</html>
