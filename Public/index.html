
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Portal</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fb;
      color: #222;
    }

    .top {
      text-align: right;
      padding: 20px 7%;
    }

    .top a, button {
      background: #3157d5;
      color: white;
      padding: 11px 18px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
    }

    header {
      text-align: center;
      padding: 15px 20px 30px;
    }

    .gallery {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 20px 30px;
    }

    .gallery img {
      width: 28%;
      min-width: 180px;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
    }

    form {
      max-width: 480px;
      margin: 0 auto 40px;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      width: 100%;
    }

    #status {
      text-align: center;
      margin-top: 15px;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="top">
    <a href="/admin">Admin Panel</a>
  </div>

  <header>
    <h1>Welcome to Message Portal</h1>
    <p>Fill in the form below to send us a message.</p>
  </header>

  <section class="gallery">
    <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=600&q=80" alt="Modern office">
    <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=600&q=80" alt="Workspace">
    <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=600&q=80" alt="Team working together">
  </section>

  <form id="messageForm">
    <h2>Contact Us</h2>

    <label for="name">Full Name</label>
    <input id="name" name="name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel" required>

    <label for="subject">Subject</label>
    <input id="subject" name="subject" required>

    <label for="dob">Date of Birth</label>
    <input id="dob" name="dob" type="date" required>

    <label for="image">Upload Image</label>
    <input id="image" name="image" type="file" accept="image/*" required>

    <img id="preview" alt="Selected image preview">

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <button type="submit">Submit Message</button>
    <p id="status"></p>
  </form>

  <script>
    const form = document.getElementById("messageForm");
    const status = document.getElementById("status");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      preview.style.display = "none";

      if (file && file.type.startsWith("image/")) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = new FormData(form);

      try {
        const response = await fetch("/api/messages", {
          method: "POST",
          body: data
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Submission failed");
        }

        status.textContent = "Message submitted successfully!";
        form.reset();
        preview.style.display = "none";
        preview.removeAttribute("src");

      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>

      }
    });
  </script>
</body>
</html>
