
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fb;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 15px #0001;
      overflow-wrap: anywhere;
    }

    .card img {
      max-width: 100%;
      max-height: 250px;
      display: block;
      margin-top: 10px;
      border-radius: 8px;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px;
    }
  </style>
</head>

<body>
  <h2 style="text-align:center">Admin Panel - User Messages</h2>
  <a class="back" href="/">Back to User Page</a>

  <div id="messages">Loading messages...</div>

  <script>
    async function loadMessages() {
      const box = document.getElementById("messages");

      try {
        const response = await fetch("/api/messages");

        if (!response.ok) {
          throw new Error("Could not load messages");
        }

        const messages = await response.json();
        box.replaceChildren();

        if (messages.length === 0) {
          box.textContent = "No messages submitted yet.";
          return;
        }

        messages.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = item.subject || "User Message";
          card.appendChild(title);

          ["name", "email", "phone", "dob", "message"].forEach(key => {
            const p = document.createElement("p");
            p.textContent =
              key.charAt(0).toUpperCase() + key.slice(1) +
              ": " + (item[key] || "Not provided");
            card.appendChild(p);
          });

          if (item.image_url) {
            const img = document.createElement("img");
            img.src = item.image_url;
            img.alt = "Uploaded image";
            img.onerror = () => {
              img.alt = "Image could not be loaded";
              img.removeAttribute("src");
            };
            card.appendChild(img);
          }

          box.appendChild(card);
        });
      } catch (error) {
        box.textContent = "Could not load messages. Check the server.";
      }
    }

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>

</body>
</html>
