
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h2>Admin Panel - User Messages</h2>
  <div id="messages">Loading messages...</div>

  <script>
    async function loadMessages() {
      const box = document.getElementById("messages");

      try {
        const response = await fetch("/api/messages");
        if (!response.ok) throw new Error("Could not load messages");

        const messages = await response.json();
        box.replaceChildren();

        if (messages.length === 0) {
          box.textContent = "No messages submitted yet.";
          return;
        }

        messages.forEach(item => {
          const card = document.createElement("div");
          const title = document.createElement("h3");
          title.textContent = item.subject;

          card.appendChild(title);

          ["name", "email", "phone", "message"].forEach(key => {
            const p = document.createElement("p");
            p.textContent = key.charAt(0).toUpperCase()
              + key.slice(1) + ": " + item[key];
            card.appendChild(p);
          });

          box.appendChild(card);
        });
      } catch (error) {
        box.textContent = "Could not load messages. Please refresh.";
      }
    }

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>

  </script>
</body>
</html>
