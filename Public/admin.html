
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">Admin Panel</span>
    <a href="/" class="admin-link">Back to User Page</a>
  </nav>

  <main class="admin-container">
    <h1>Submitted Details</h1>
    <p id="status" role="status">Loading submissions...</p>
    <div id="messages" class="message-grid"></div>
  </main>

  <script>
    const container = document.getElementById("messages");
    const status = document.getElementById("status");

    async function loadMessages() {
      try {
        const response = await fetch("/api/messages");

        if (!response.ok) {
          throw new Error("Could not load submissions.");
        }

        const messages = await response.json();
        container.replaceChildren();

        if (messages.length === 0) {
          status.textContent = "No submissions yet.";
          return;
        }

        status.textContent = `Total submissions: ${messages.length}`;

        messages.forEach(item => {
          const card = document.createElement("article");
          card.className = "message-card";

          const heading = document.createElement("h3");
          heading.textContent = item.name;
          card.appendChild(heading);

          const fields = [
            ["Email", item.email],
            ["Phone", item.phone],
            ["Date", item.submitted_date],
            ["Marks", `${item.marks} / 100`],
            ["Message", item.message]
          ];

          fields.forEach(([label, value]) => {
            const p = document.createElement("p");
            const strong = document.createElement("strong");

            strong.textContent = label + ": ";
            p.appendChild(strong);
            p.appendChild(
              document.createTextNode(String(value ?? ""))
            );

            card.appendChild(p);
          });

          container.appendChild(card);
        });
      } catch (error) {
        status.textContent = error.message;
      }
    }

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>

</body>
</html>



</body>
</html>
